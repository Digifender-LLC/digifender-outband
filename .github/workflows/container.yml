name: Container

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=alpha,enable=${{ contains(github.ref_name, 'alpha') }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # GHCR packages default to private even for public repos.
      - name: Ensure package is public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER}"
          name="${GITHUB_REPOSITORY#*/}"
          name_lc="$(printf '%s' "$name" | tr '[:upper:]' '[:lower:]')"
          # User-owned packages
          if gh api --method PUT "user/packages/container/${name_lc}/visibility" \
              -f visibility=public >/dev/null 2>&1; then
            echo "Set user package ${name_lc} visibility=public"
            exit 0
          fi
          # Org-owned packages
          if gh api --method PUT "orgs/${owner}/packages/container/${name_lc}/visibility" \
              -f visibility=public >/dev/null 2>&1; then
            echo "Set org package ${name_lc} visibility=public"
            exit 0
          fi
          echo "::warning::Could not set package visibility via API; set it manually in GitHub Packages settings."
