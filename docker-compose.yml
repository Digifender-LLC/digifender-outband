services:
  outband:
    build: .
    ports:
      - "8080:8080"
    environment:
      OUTBAND_LISTEN: ":8080"
      OUTBAND_UI_PASS: "${OUTBAND_UI_PASS:?set OUTBAND_UI_PASS}"
      OUTBAND_DATA_DIR: /data
      # Optional OIDC SSO (when set, OUTBAND_UI_PASS can be break-glass only;
      # with complete OIDC you may omit OUTBAND_UI_PASS — adjust the ?set above):
      # OUTBAND_OIDC_ISSUER: "https://idp.example/realms/ops"
      # OUTBAND_OIDC_CLIENT_ID: "outband"
      # OUTBAND_OIDC_CLIENT_SECRET: "${OUTBAND_OIDC_CLIENT_SECRET}"
      # OUTBAND_OIDC_REDIRECT_URL: "https://outband.example/auth/oidc/callback"
      # Legacy single-host (still works). For multi-host JSON inventory, unset these
      # and set OUTBAND_HOSTS / OUTBAND_DEFAULT_HOST instead — see below.
      OUTBAND_BMC_HOST: "${OUTBAND_BMC_HOST:-192.168.9.74}"
      OUTBAND_BMC_USER: "${OUTBAND_BMC_USER:-root}"
      OUTBAND_BMC_PASS: "${OUTBAND_BMC_PASS:?set OUTBAND_BMC_PASS}"
      # Example multi-host inventory (Compose substitutes ${OUTBAND_BMC_PASS}):
      # OUTBAND_DEFAULT_HOST: tyan
      # OUTBAND_HOSTS: |
      #   [
      #     {
      #       "id": "tyan",
      #       "name": "Tyan BMC",
      #       "provider": "ipmi",
      #       "host": "192.168.9.74",
      #       "port": 623,
      #       "user": "root",
      #       "password": "${OUTBAND_BMC_PASS}"
      #     }
      #   ]
    volumes:
      - outband-data:/data
    # Host networking can help IPMI UDP on some LAN setups:
    # network_mode: host
    restart: unless-stopped

volumes:
  outband-data:
