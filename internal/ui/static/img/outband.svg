<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" aria-hidden="true">
  <!-- Outband mark: outer band (OOB) + inner board with clear midline -->
  <defs>
    <mask id="midline" maskUnits="userSpaceOnUse">
      <rect x="9" y="9" width="14" height="14" rx="2" fill="#fff"/>
      <path d="M9 16h14" stroke="#000" stroke-width="2" stroke-linecap="round"/>
    </mask>
  </defs>
  <rect x="2" y="2" width="28" height="28" rx="6" stroke="#3dba9c" stroke-width="2.5"/>
  <rect x="9" y="9" width="14" height="14" rx="2" fill="#3dba9c" opacity="0.9" mask="url(#midline)"/>
</svg>
