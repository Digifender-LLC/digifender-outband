{{define "media.html"}}
<!DOCTYPE html>
<html lang="en">
<head>{{template "head" .}}</head>
<body>
  <div class="app">
    {{template "sidebar" .}}
    {{template "topbar" .}}
    <main class="content">
      <section class="page">
        <header class="page-head">
          <h1>Virtual media</h1>
          <p class="lede">Mount an ISO as a virtual CD-ROM on the host. Upload images to the server library, pick an existing file, or stream from a URL.</p>
        </header>
        {{template "partials/media_panel.html" .}}
      </section>
    </main>
  </div>
  <script src="/static/js/media.js" defer></script>
</body>
</html>
{{end}}
