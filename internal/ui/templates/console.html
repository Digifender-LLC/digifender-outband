{{define "console.html"}}
<!DOCTYPE html>
<html lang="en">
<head>
  {{template "head" .}}
  <link rel="stylesheet" href="/static/vendor/xterm.css">
  <script src="/static/vendor/xterm.js" defer></script>
  <script src="/static/vendor/xterm-addon-fit.js" defer></script>
  <script src="/static/js/console.js" defer></script>
</head>
<body class="console-body">
  <div class="shell console-shell">
    {{template "nav" .}}
    <main class="main console-main">
      <header class="page-head compact">
        <h1>SOL Console</h1>
        <p class="lede">Serial-over-LAN via IPMI — not video KVM. One session per mIPMI process.</p>
        <p id="sol-banner" class="sol-banner" role="status">Connecting…</p>
      </header>
      <div id="terminal" class="terminal" aria-label="SOL terminal"></div>
    </main>
  </div>
</body>
</html>
{{end}}
