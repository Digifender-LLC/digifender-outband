{{define "kvm.html"}}
<!DOCTYPE html>
<html lang="en">
<head>{{template "head" .}}</head>
<body>
  <div class="app">
    {{template "sidebar" .}}
    {{template "topbar" .}}
    <main class="content bleed">
      <header class="page-head compact">
        <h1>KVM</h1>
        <p class="lede">{{.Backend}} via noVNC. One session per host.</p>
      </header>
      <p id="kvm-banner" class="sol-banner">{{.Status}} · port {{.Port}}{{if .TLS}} (TLS){{end}}</p>
      <iframe
        class="kvm-frame"
        title="KVM console"
        src="/static/novnc/vnc.html?autoconnect=true&reconnect=true&path={{.WSPath}}&resize=scale&show_dot=true"
        allow="clipboard-read; clipboard-write"
      ></iframe>
    </main>
  </div>
</body>
</html>
{{end}}
